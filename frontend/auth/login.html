<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Student Helper Hub</title>

<script src="login.js" defer></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eef3f8,#dbe9ff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    width:420px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:#0d47a1;
    margin-bottom:10px;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    background:#0d47a1;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#08306b;
}

.bottom{
    margin-top:20px;
    text-align:center;
}

.bottom a{
    color:#0d47a1;
    text-decoration:none;
    font-weight:bold;
}

#msg{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

.show-btn{
    cursor:pointer;
    color:#0d47a1;
    font-size:14px;
    margin-top:-10px;
    margin-bottom:15px;
    display:inline-block;
}

</style>
</head>

<body>

<div class="login-box">

    <h1>Welcome Back 👋</h1>

    <p>Login to continue</p>

    <input type="email"
           id="email"
           placeholder="Enter Email">

    <input type="password"
           id="password"
           placeholder="Enter Password">

    <span class="show-btn"
          onclick="togglePassword()">
          Show Password
    </span>

    <button onclick="loginUser()">
        Login
    </button>

    <div id="msg"></div>

    <div class="bottom">
        Don't have account?
        <a href="signup.html">Signup</a>
    </div>

</div>

</body>
</html>

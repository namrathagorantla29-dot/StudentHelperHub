<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Helper Hub | Subjects</title>

<script src="data_notes.js" defer></script>
<script src="subjectnotes.js" defer></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
    min-height:100vh;
}

/* ================= NAVBAR ================= */

nav{

    background:#0d47a1;
    color:white;

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:18px 40px;

    box-shadow:0 4px 15px rgba(0,0,0,.15);

}

nav h2{

    font-size:28px;

}

nav button{

    background:white;
    color:#0d47a1;

    border:none;

    padding:10px 20px;

    border-radius:10px;

    cursor:pointer;

    font-size:15px;
    font-weight:bold;

    transition:.3s;

}

nav button:hover{

    background:#1565c0;
    color:white;

}

/* ================= CONTAINER ================= */

.container{

    width:92%;
    max-width:1250px;

    margin:auto;

    padding:40px 0;

}

/* ================= TITLE ================= */

#semesterTitle{

    text-align:center;

    font-size:40px;

    color:#0d47a1;

    margin-bottom:15px;

}

.subtitle{

    text-align:center;

    color:#666;

    font-size:18px;

    margin-bottom:40px;

}

/* ================= GRID ================= */

.grid{

    display:grid;

    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));

    gap:30px;

}

/* ================= SUBJECT CARD ================= */

.subject-card{

    background:white;

    border-radius:20px;

    padding:30px;

    text-align:center;

    cursor:pointer;

    transition:.35s;

    box-shadow:0 10px 25px rgba(0,0,0,.08);

}

.subject-card:hover{

    transform:translateY(-10px);

    box-shadow:0 18px 35px rgba(0,0,0,.15);

}

/* ================= ICON ================= */

.subject-icon{

    font-size:60px;

    margin-bottom:20px;

}

/* ================= SUBJECT NAME ================= */

.subject-card h2{

    color:#0d47a1;

    margin-bottom:12px;

}

/* ================= DESCRIPTION ================= */

.subject-card p{

    color:#555;

    line-height:1.6;

    margin-bottom:10px;

}

/* ================= TOPIC BADGE ================= */

.topic-count{

    display:inline-block;

    margin-top:10px;

    padding:8px 16px;

    background:#e3f2fd;

    color:#1565c0;

    border-radius:30px;

    font-weight:bold;

}

/* ================= BUTTON ================= */

.subject-card button{

    margin-top:20px;

    width:100%;

    border:none;

    padding:13px;

    border-radius:10px;

    background:#1565c0;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:.3s;

}

.subject-card button:hover{

    background:#0d47a1;

}

/* ================= FOOTER ================= */

footer{

    text-align:center;

    margin-top:60px;

    padding:20px;

    color:#777;

}

/* ================= RESPONSIVE ================= */

@media(max-width:768px){

nav{

    flex-direction:column;

    gap:15px;

}

nav h2{

    font-size:24px;

}

#semesterTitle{

    font-size:32px;

}

.subject-card{

    padding:25px;

}

}

</style>

</head>

<body>

<nav>

<h2>📚 Student Helper Hub</h2>

<button onclick="goHome()">🏠 Home</button>

</nav>

<div class="container">

<h1 id="semesterTitle"></h1>

<p class="subtitle">

Choose your subject and start learning.

</p>

<div id="subjectsContainer" class="grid">

<!-- JavaScript will load subject cards here -->

</div>

</div>

<footer>

© 2026 Student Helper Hub

</footer>

</body>

</html>
